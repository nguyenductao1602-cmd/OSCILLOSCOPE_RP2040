<svg viewBox="0 0 980 440" width="1960" height="880" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; color:#0f172a; font-family:Arial, 'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#047857" />
    </marker>
    <marker id="arrowFg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0f172a" />
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="440" fill="#ffffff" />
  <g stroke="#0f172a" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- TIER 1: RP2040 FIRMWARE DMA -->
    <rect x="14" y="14" width="342" height="410" rx="10" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2.4" />
    <line x1="14" y1="62" x2="356" y2="62" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="185" y="36" fill="#1d4ed8" stroke="none" font-size="13.8" font-weight="bold" text-anchor="middle">
      TẦNG 1: RP2040 FIRMWARE DMA (.ino)
    </text>
    <text x="185" y="54" fill="#475569" stroke="none" font-size="10.3" text-anchor="middle">
      (Arduino-Pico SDK • Khởi động 125 MHz / Boost 288 MHz @ 1.20V)
    </text>

    <!-- 1.1 ADC0 + DMA -->
    <rect x="28" y="76" width="314" height="74" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="185" y="95" fill="#1d4ed8" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      1. Khối thu mẫu SAR ADC0 + Kênh DMA
    </text>
    <text x="185" y="113" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      GPIO26 (/ADC_in) → FIFO 16-bit → DMA (DREQ_ADC)
    </text>
    <text x="185" y="129" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      Thu 1024 mẫu 12-bit (2048 B); R0..R5: PLL_USB 48MHz (10–500kSa/s)
    </text>
    <text x="185" y="143" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      R6..R8: PLL_SYS 288MHz (1.0 / 1.5 / 3.0 MSa/s, tránh kẹt bit-11)
    </text>

    <!-- 1.2 GPIO0 & GPIO20 PWM -->
    <rect x="28" y="162" width="314" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="185" y="181" fill="#1d4ed8" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      2. Khối phát xung chuẩn GPIO0 &amp; GPIO20 PWM
    </text>
    <text x="185" y="199" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      GPIO0: Phát xung vuông Test (10 Hz – 500 kHz, 1–99%)
    </text>
    <text x="185" y="217" fill="#475569" stroke="none" font-size="9.8" text-anchor="middle">
      GPIO20 (/Trig_PWM): PWM 100 kHz 50% tạo áp chuẩn ~1.65V
    </text>

    <!-- 1.3 SW1 / SW2 / SW3 Reader -->
    <rect x="28" y="244" width="314" height="74" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="185" y="263" fill="#1d4ed8" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      3. Quét công tắc SW1 / SW2 / SW3 (Chu kỳ 60 ms)
    </text>
    <text x="185" y="281" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      ADC2 (SW1: GND/AC/DC) • ADC1 (SW2: 1V/0.1V/10mV)
    </text>
    <text x="185" y="297" fill="#475569" stroke="none" font-size="9.6" text-anchor="middle">
      Hạ clk_adc về 48 MHz, xả tụ S&amp;H, trung vị 5 mẫu + GPIO22 (SW3)
    </text>
    <text x="185" y="311" fill="#475569" stroke="none" font-size="9.6" text-anchor="middle">
      Mã hóa: SwByte = (SW1 &amp; 3) | ((SW2 &amp; 3) &lt;&lt; 2) | ((SW3 &amp; 1) &lt;&lt; 4)
    </text>

    <!-- 1.4 Framer & Command Parser -->
    <rect x="28" y="330" width="314" height="78" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 3" />
    <text x="185" y="349" fill="#1d4ed8" stroke="none" font-size="11.8" font-weight="bold" text-anchor="middle">
      4. Đóng gói khung 2053B &amp; Xử lý lệnh ASCII
    </text>
    <text x="185" y="367" fill="#0f172a" stroke="none" font-size="10.2" font-family="Consolas, monospace" text-anchor="middle">
      [0xAA][0x55][RateCode][SwByte][2048B ADC][XOR]
    </text>
    <text x="185" y="385" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      Truyền mỗi 33 ms (~30 FPS); giải mã lệnh R&lt;code&gt; và G&lt;f&gt;,&lt;d&gt;
    </text>

    <!-- Internal link line -->
    <polyline points="28,112 20,112 20,368 26,368" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#arrowBlue)" />
    <line x1="20" y1="280" x2="28" y2="280" stroke="#1d4ed8" stroke-width="1.6" />

    <!-- MIDDLE: USB-CDC BRIDGE -->
    <rect x="382" y="76" width="216" height="286" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" />
    <text x="490" y="102" fill="#b45309" stroke="none" font-size="12.8" font-weight="bold" text-anchor="middle">
      GIAO THỨC USB-CDC
    </text>
    <text x="490" y="119" fill="#475569" stroke="none" font-size="10.2" text-anchor="middle">
      (Full-Duplex Virtual COM • ~61.6 KB/s)
    </text>

    <!-- Upstream Box -->
    <rect x="396" y="136" width="188" height="86" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8" />
    <text x="490" y="156" fill="#1d4ed8" stroke="none" font-size="11.6" font-weight="bold" text-anchor="middle">
      Khung nhị phân 2053 Bytes
    </text>
    <text x="490" y="174" fill="#0f172a" stroke="none" font-size="10" font-family="Consolas, monospace" text-anchor="middle">
      4B Header + 2048B + 1B XOR
    </text>
    <text x="490" y="191" fill="#475569" stroke="none" font-size="9.8" text-anchor="middle">
      1024 mẫu uint16 LE (0..4095)
    </text>
    <text x="490" y="207" fill="#475569" stroke="none" font-size="9.8" text-anchor="middle">
      Kèm RateCode (0..8) &amp; SwByte
    </text>

    <line x1="356" y1="178" x2="394" y2="178" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrowBlue)" />
    <line x1="584" y1="178" x2="622" y2="178" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrowBlue)" />

    <text x="490" y="242" fill="#b45309" stroke="none" font-size="10.2" font-weight="bold" text-anchor="middle">
      ← Truyền song công bất đồng bộ →
    </text>

    <!-- Downstream Box -->
    <rect x="396" y="256" width="188" height="88" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
    <text x="490" y="276" fill="#047857" stroke="none" font-size="11.6" font-weight="bold" text-anchor="middle">
      Lệnh ASCII: R &amp; G (Kết thúc \n)
    </text>
    <text x="490" y="294" fill="#0f172a" stroke="none" font-size="10" font-family="Consolas, monospace" text-anchor="middle">
      R&lt;0..8&gt;\n : Đặt tốc độ Fs
    </text>
    <text x="490" y="311" fill="#0f172a" stroke="none" font-size="10" font-family="Consolas, monospace" text-anchor="middle">
      G&lt;freq&gt;,&lt;duty&gt;\n : Xung GPIO0
    </text>
    <text x="490" y="329" fill="#475569" stroke="none" font-size="9.6" text-anchor="middle">
      (10–500.000 Hz, Duty 1–99%)
    </text>

    <line x1="624" y1="300" x2="586" y2="300" stroke="#047857" stroke-width="2.4" marker-end="url(#arrowGreen)" />
    <line x1="396" y1="300" x2="358" y2="300" stroke="#047857" stroke-width="2.4" marker-end="url(#arrowGreen)" />

    <!-- TIER 2: WINFORMS C# BTL_UDMT -->
    <rect x="624" y="14" width="342" height="410" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="2.4" />
    <line x1="624" y1="62" x2="966" y2="62" stroke="#047857" stroke-width="1.5" />
    <text x="795" y="36" fill="#047857" stroke="none" font-size="13.8" font-weight="bold" text-anchor="middle">
      TẦNG 2: WINFORMS C# (BTL_UDMT)
    </text>
    <text x="795" y="54" fill="#475569" stroke="none" font-size="10.3" text-anchor="middle">
      (.NET Framework 4.7.2 • Form1.cs &amp; Form1.Designer.cs)
    </text>

    <!-- 2.1 Async Serial & Parser -->
    <rect x="638" y="76" width="314" height="70" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="795" y="95" fill="#047857" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      1. Quản lý COM bất đồng bộ &amp; Giải mã (Parser)
    </text>
    <text x="795" y="113" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      Open/Close bất đồng bộ (Timeout 2s + Handshake)
    </text>
    <text x="795" y="130" fill="#475569" stroke="none" font-size="9.6" text-anchor="middle">
      Đồng bộ 0xAA 0x55, kiểm tra XOR, tách RateCode, SwByte &amp; 1024 mẫu
    </text>

    <line x1="795" y1="146" x2="795" y2="160" marker-end="url(#arrowFg)" />

    <!-- 2.2 AFE Math & Auto Switch Sync -->
    <rect x="638" y="164" width="314" height="74" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="795" y="183" fill="#047857" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      2. Đồng bộ công tắc &amp; Toán học AFE (AFE Math)
    </text>
    <text x="795" y="201" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      V_in = (V_ADC − 1.650) / (8.6888 · α_1 · α_2,hw)
    </text>
    <text x="795" y="218" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      Tự đồng bộ SW1, SW2, SW3 (X1/X5); X2 thu phóng hiển thị
    </text>
    <text x="795" y="232" fill="#475569" stroke="none" font-size="9.6" text-anchor="middle">
      Tính 8 thông số: Vpp, Vmax, Vmin, Vavg, Vrms, Freq, Period, Duty
    </text>

    <line x1="795" y1="238" x2="795" y2="252" marker-end="url(#arrowFg)" />

    <!-- 2.3 Software Trigger Engine -->
    <rect x="638" y="256" width="314" height="68" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <text x="795" y="275" fill="#047857" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      3. Bộ đồng bộ sóng phần mềm (Trigger Engine)
    </text>
    <text x="795" y="293" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      Dò sườn lên / sườn xuống có trễ Hysteresis (5% V/div)
    </text>
    <text x="795" y="310" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      3 chế độ Auto / Normal / Single trên bộ đệm kép (workVolts)
    </text>

    <line x1="795" y1="324" x2="795" y2="338" marker-end="url(#arrowFg)" />

    <!-- 2.4 GDI+ Renderer -->
    <rect x="638" y="342" width="314" height="68" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
    <text x="795" y="361" fill="#047857" stroke="none" font-size="12" font-weight="bold" text-anchor="middle">
      4. Đồ họa GDI+ (10×8 Div) &amp; Xuất dữ liệu
    </text>
    <text x="795" y="379" fill="#0f172a" stroke="none" font-size="10.4" font-weight="bold" text-anchor="middle">
      12 mức Time/Div (1 us–5 ms/div), hiển thị Fs góc trên phải
    </text>
    <text x="795" y="396" fill="#475569" stroke="none" font-size="9.7" text-anchor="middle">
      Con trỏ đo dT / 1/dT, phát xung test GPIO0, lưu ảnh PNG &amp; CSV
    </text>
  </g>
</svg>