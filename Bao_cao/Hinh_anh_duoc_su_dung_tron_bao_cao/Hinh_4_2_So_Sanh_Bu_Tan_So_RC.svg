<svg viewBox="0 0 960 360" width="1920" height="720" xmlns="http://www.w3.org/2000/svg" style="background-color:#ffffff; color:#0f172a; font-family:Arial, 'Segoe UI', sans-serif;">
  <rect x="0" y="0" width="960" height="360" fill="#ffffff" />
  <g stroke="#0f172a" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Panel 1: Thiếu bù (Under-compensated) -->
    <rect x="20" y="20" width="286" height="316" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <text x="163" y="44" fill="#b45309" stroke="none" font-size="13" font-weight="bold" text-anchor="middle">
      (a) Thiếu bù (Under-compensated)
    </text>
    <text x="163" y="63" fill="#475569" stroke="none" font-size="10.5" text-anchor="middle">
      R₁·C₁ &lt; R₂·(C₂ + C_stray) → Suy hao cao tần
    </text>
    <!-- Scope screen 1 -->
    <rect x="38" y="78" width="250" height="190" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
      <line x1="38" y1="125" x2="288" y2="125" />
      <line x1="38" y1="173" x2="288" y2="173" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="38" y1="220" x2="288" y2="220" />
      <line x1="100" y1="78" x2="100" y2="268" />
      <line x1="163" y1="78" x2="163" y2="268" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="225" y1="78" x2="225" y2="268" />
    </g>
    <!-- Ideal square wave reference (dashed gray) -->
    <polyline points="48,225 88,225 88,120 188,120 188,225 278,225" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" />
    <!-- Under-compensated rounded wave -->
    <path d="M 48,225 L 88,225 L 88,162 Q 96,122 145,120 L 188,120 L 188,183 Q 196,223 245,225 L 278,225" stroke="#b45309" stroke-width="2.6" fill="none" />
    <circle cx="98" cy="138" r="14" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 2" fill="none" />
    <text x="163" y="290" fill="#0f172a" stroke="none" font-size="10.6" font-weight="bold" text-anchor="middle">
      Góc cạnh lên bị bo tròn / hõm góc
    </text>
    <text x="163" y="308" fill="#475569" stroke="none" font-size="10" text-anchor="middle">
      (Khi tụ nhánh trên quá nhỏ hoặc C₂ + C_stray lớn)
    </text>

    <!-- Panel 2: Quá bù (Over-compensated) -->
    <rect x="337" y="20" width="286" height="316" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <text x="480" y="44" fill="#dc2626" stroke="none" font-size="13" font-weight="bold" text-anchor="middle">
      (b) Quá bù (Over-compensated)
    </text>
    <text x="480" y="63" fill="#475569" stroke="none" font-size="10.5" text-anchor="middle">
      R₁·C₁ &gt; R₂·(C₂ + C_stray) → Vọt lố cao tần
    </text>
    <!-- Scope screen 2 -->
    <rect x="355" y="78" width="250" height="190" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
      <line x1="355" y1="125" x2="605" y2="125" />
      <line x1="355" y1="173" x2="605" y2="173" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="355" y1="220" x2="605" y2="220" />
      <line x1="417" y1="78" x2="417" y2="268" />
      <line x1="480" y1="78" x2="480" y2="268" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="542" y1="78" x2="542" y2="268" />
    </g>
    <!-- Ideal square wave reference -->
    <polyline points="365,225 405,225 405,120 505,120 505,225 595,225" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" />
    <!-- Over-compensated overshoot wave -->
    <path d="M 365,225 L 405,225 L 405,88 Q 412,118 448,120 L 505,120 L 505,256 Q 512,227 548,225 L 595,225" stroke="#dc2626" stroke-width="2.6" fill="none" />
    <circle cx="408" cy="96" r="14" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="3 2" fill="none" />
    <text x="480" y="290" fill="#0f172a" stroke="none" font-size="10.6" font-weight="bold" text-anchor="middle">
      Gai vọt lố nhọn (Overshoot) ở sườn xung
    </text>
    <text x="480" y="308" fill="#475569" stroke="none" font-size="10" text-anchor="middle">
      (Khi thiếu tụ bù nhánh dưới C₂₈, C₂₉)
    </text>

    <!-- Panel 3: Bù chuẩn (Properly Compensated) -->
    <rect x="654" y="20" width="286" height="316" rx="8" fill="#f0fdf4" stroke="#047857" stroke-width="2.2" />
    <text x="797" y="44" fill="#047857" stroke="none" font-size="13" font-weight="bold" text-anchor="middle">
      (c) Bù chuẩn trên mạch chính thức
    </text>
    <text x="797" y="63" fill="#475569" stroke="none" font-size="10.5" text-anchor="middle">
      R₁·C₁ = R₂·(C₂ + C_stray) (τ = 5.4 us &amp; 12.0 us)
    </text>
    <!-- Scope screen 3 -->
    <rect x="672" y="78" width="250" height="190" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
    <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
      <line x1="672" y1="125" x2="922" y2="125" />
      <line x1="672" y1="173" x2="922" y2="173" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="672" y1="220" x2="922" y2="220" />
      <line x1="734" y1="78" x2="734" y2="268" />
      <line x1="797" y1="78" x2="797" y2="268" stroke="#94a3b8" stroke-dasharray="none" />
      <line x1="859" y1="78" x2="859" y2="268" />
    </g>
    <!-- Properly compensated square wave -->
    <polyline points="682,225 722,225 722,120 822,120 822,225 912,225" stroke="#047857" stroke-width="2.6" />
    <text x="797" y="290" fill="#047857" stroke="none" font-size="10.6" font-weight="bold" text-anchor="middle">
      Sườn đứng 90°, đỉnh và đáy phẳng
    </text>
    <text x="797" y="308" fill="#475569" stroke="none" font-size="9.8" text-anchor="middle">
      (100mV: 3pF // 15pF; 1V: 6pF // [120pF+470pF])
    </text>
  </g>
</svg>